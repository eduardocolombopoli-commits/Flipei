<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7C3AED" />
  <title>Flipei — Estudar virou jogo</title>
  <meta name="description" content="Flipei: flashcards + gamificação + IA para ENEM e vestibulares. Protótipo de experiência." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* =========================================================================
   FLIPEI — Design System
   Paleta: Roxo (principal) + Verde-limão (acerto) + Laranja (streak) + Amarelo (XP)
   Fonte de tipografia: Baloo 2 (display/divertida) + Nunito (texto)
   ========================================================================= */

:root {
  /* Brand */
  --roxo-900: #4C1D95;
  --roxo-700: #6D28D9;
  --roxo-600: #7C3AED;   /* principal */
  --roxo-500: #8B5CF6;
  --roxo-300: #C4B5FD;
  --roxo-100: #EDE9FE;
  --roxo-50:  #F5F3FF;

  --verde-600: #16A34A;
  --verde-500: #22C55E;  /* acerto / sucesso */
  --verde-300: #86EFAC;
  --verde-100: #DCFCE7;

  --laranja-500: #FB923C; /* streak */
  --laranja-600: #F97316;
  --laranja-100: #FFEDD5;

  --amarelo-400: #FACC15; /* XP / gems */
  --amarelo-300: #FDE047;
  --amarelo-100: #FEF9C3;

  --vermelho-500: #EF4444; /* erro / vidas */
  --vermelho-100: #FEE2E2;

  --azul-500: #3B82F6;
  --rosa-500: #EC4899;

  /* Neutros */
  --ink: #1F1235;        /* texto principal (roxo-quase-preto) */
  --ink-soft: #5B5470;
  --ink-faint: #9690A8;
  --line: #ECE9F2;
  --line-strong: #DCD7E8;
  --bg: #F7F5FB;
  --surface: #FFFFFF;
  --surface-2: #FBFAFE;

  /* Sombras */
  --sh-sm: 0 1px 2px rgba(31,18,53,.06), 0 1px 3px rgba(31,18,53,.05);
  --sh-md: 0 6px 18px rgba(31,18,53,.08);
  --sh-lg: 0 16px 40px rgba(31,18,53,.14);
  --sh-pop: 0 10px 0 rgba(0,0,0,.10); /* botões 3D */

  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-xl: 34px;

  --grad-roxo: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
  --grad-verde: linear-gradient(135deg, #4ADE80 0%, #16A34A 100%);
  --grad-streak: linear-gradient(135deg, #FDBA74 0%, #F97316 100%);
  --grad-xp: linear-gradient(135deg, #FDE047 0%, #F59E0B 100%);
  --grad-festa: linear-gradient(120deg,#8B5CF6,#EC4899,#FB923C,#FACC15);
}

/* ---------- Reset ---------- */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height:100%; }
body {
  font-family:'Nunito', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size:16px;
  line-height:1.45;
  overflow:hidden;
  position:fixed;
  inset:0;
}
h1,h2,h3,h4,.display { font-family:'Baloo 2', 'Nunito', sans-serif; line-height:1.15; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
img { max-width:100%; display:block; }
::selection { background: var(--roxo-300); }

/* Scroll helpers */
.scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color: var(--roxo-300) transparent; }
.scroll::-webkit-scrollbar{ width:8px; }
.scroll::-webkit-scrollbar-thumb{ background:var(--roxo-300); border-radius:8px; }

/* =========================================================================
   FX canvas + Toasts
   ========================================================================= */
#fx-canvas{ position:fixed; inset:0; pointer-events:none; z-index:9000; }
#toast-layer{ position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:9500; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(440px,92vw); }
.toast{
  background:var(--ink); color:#fff; padding:11px 16px; border-radius:14px;
  font-weight:800; font-size:14px; box-shadow:var(--sh-lg);
  display:flex; gap:9px; align-items:center; animation:toastIn .35s cubic-bezier(.2,1.4,.4,1) both;
}
.toast.success{ background:var(--verde-600); }
.toast.warn{ background:var(--laranja-600); }
.toast.brand{ background:var(--roxo-700); }
@keyframes toastIn{ from{opacity:0; transform:translateY(-16px) scale(.9);} }

/* =========================================================================
   App shell — frame
   ========================================================================= */
#app{ width:100%; height:100%; }

/* Stage centers the phone on desktop; full bleed on mobile */
.stage{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(139,92,246,.18), transparent 60%),
    radial-gradient(700px 500px at 105% 110%, rgba(251,146,60,.16), transparent 55%),
    var(--bg);
}

/* Phone (student app) */
.phone{
  position:relative;
  width:420px; max-width:100%;
  height:min(900px, 100%);
  background:var(--surface);
  border-radius:42px;
  box-shadow: var(--sh-lg);
  overflow:hidden;
  display:flex; flex-direction:column;
  border:1px solid var(--line);
}
.phone-notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:140px; height:26px; background:var(--ink); border-radius:0 0 16px 16px; z-index:60;
}
.screen{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
.screen-body{ flex:1; min-height:0; position:relative; }

@media (max-width:520px){
  .stage{ background:var(--surface); }
  .phone{ width:100%; height:100%; border-radius:0; border:none; box-shadow:none; }
  .phone-notch{ display:none; }
}

/* =========================================================================
   Buttons
   ========================================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  font-weight:900; font-size:16px; letter-spacing:.2px;
  padding:15px 22px; border-radius:18px; user-select:none;
  transition:transform .08s ease, filter .15s ease, box-shadow .15s ease;
  position:relative; text-transform:uppercase;
}
.btn:active{ transform:translateY(3px); }
.btn-3d{ box-shadow:0 5px 0 rgba(0,0,0,.18); }
.btn-3d:active{ box-shadow:0 1px 0 rgba(0,0,0,.18); }
.btn-roxo{ background:var(--roxo-600); color:#fff; box-shadow:0 5px 0 #5B21B6; }
.btn-roxo:active{ box-shadow:0 1px 0 #5B21B6; }
.btn-verde{ background:var(--verde-500); color:#fff; box-shadow:0 5px 0 var(--verde-600); }
.btn-verde:active{ box-shadow:0 1px 0 var(--verde-600); }
.btn-amarelo{ background:var(--amarelo-400); color:#7A4F01; box-shadow:0 5px 0 #D69E00; }
.btn-ghost{ background:var(--roxo-50); color:var(--roxo-700); }
.btn-outline{ background:#fff; color:var(--roxo-700); border:2px solid var(--line-strong); box-shadow:0 4px 0 var(--line-strong); }
.btn-outline:active{ box-shadow:0 1px 0 var(--line-strong); }
.btn-block{ width:100%; }
.btn-lg{ font-size:18px; padding:17px 24px; }
.btn-sm{ font-size:13px; padding:9px 14px; border-radius:13px; }
.btn[disabled]{ opacity:.45; pointer-events:none; }

.icon-btn{ width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:20px; background:var(--roxo-50); color:var(--roxo-700); }

/* =========================================================================
   Generic UI
   ========================================================================= */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-sm); }
.pad{ padding:18px; }
.row{ display:flex; align-items:center; gap:12px; }
.col{ display:flex; flex-direction:column; }
.between{ justify-content:space-between; }
.center{ align-items:center; justify-content:center; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1; }
.gap6{ gap:6px;} .gap8{gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;} .gap16{gap:16px;} .gap20{gap:20px;}
.mt4{margin-top:4px;} .mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;} .mt24{margin-top:24px;}
.muted{ color:var(--ink-soft); } .faint{ color:var(--ink-faint); }
.tcenter{ text-align:center; }
.h1{ font-size:30px; font-weight:800; }
.h2{ font-size:23px; font-weight:800; }
.h3{ font-size:19px; font-weight:800; }
.eyebrow{ font-weight:900; text-transform:uppercase; letter-spacing:1.4px; font-size:12px; color:var(--roxo-600); }
.small{ font-size:13px; } .tiny{ font-size:11px; }
.b{ font-weight:800; } .b9{ font-weight:900; }

.pill{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-weight:800; font-size:13px; background:var(--roxo-50); color:var(--roxo-700); }
.pill.gray{ background:#F1EFF6; color:var(--ink-soft); }
.pill.green{ background:var(--verde-100); color:var(--verde-600); }
.pill.orange{ background:var(--laranja-100); color:var(--laranja-600); }
.pill.outline{ background:#fff; border:1.5px solid var(--line-strong); color:var(--ink-soft); }

.tag-stat{ display:inline-flex; align-items:center; gap:6px; font-weight:900; font-size:15px; padding:7px 12px; border-radius:14px; }
.tag-streak{ background:var(--laranja-100); color:var(--laranja-600); }
.tag-xp{ background:var(--amarelo-100); color:#B45309; }
.tag-gem{ background:#E0F2FE; color:#0369A1; }
.tag-life{ background:var(--vermelho-100); color:var(--vermelho-500); }

/* Progress */
.bar{ height:14px; background:var(--line); border-radius:999px; overflow:hidden; }
.bar > span{ display:block; height:100%; border-radius:999px; background:var(--grad-verde); transition:width .5s cubic-bezier(.2,1,.3,1); }
.bar.xp > span{ background:var(--grad-xp); }
.bar.roxo > span{ background:var(--grad-roxo); }
.bar.thin{ height:9px; }

/* Avatar */
.avatar{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-weight:900; color:#fff; font-size:18px; flex:none; }

/* Topbar (student) */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; gap:10px; }
.topbar .brand-mini{ display:flex; align-items:center; gap:9px; font-family:'Baloo 2'; font-weight:800; font-size:20px; color:var(--roxo-700); }

/* Bottom nav */
.tabbar{
  display:flex; align-items:stretch; justify-content:space-around;
  background:#fff; border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 4px; border-radius:14px; color:var(--ink-faint); font-weight:800; font-size:11px; transition:.15s; }
.tab .ic{ font-size:23px; line-height:1; transition:transform .15s; }
.tab.active{ color:var(--roxo-700); background:var(--roxo-50); }
.tab.active .ic{ transform:translateY(-1px) scale(1.12); }

/* =========================================================================
   Logo mark
   ========================================================================= */
.logo{ display:inline-flex; align-items:center; gap:10px; }
.logo .mark{
  width:44px; height:44px; border-radius:13px; background:var(--grad-roxo);
  display:grid; place-items:center; color:#fff; font-family:'Baloo 2'; font-weight:800; font-size:24px;
  box-shadow:0 6px 14px rgba(124,58,237,.4); transform:rotate(-6deg);
  position:relative;
}
.logo .mark::after{ content:""; position:absolute; right:-3px; bottom:-3px; width:14px; height:14px; border-radius:5px; background:var(--verde-500); border:2px solid #fff; }
.logo .word{ font-family:'Baloo 2'; font-weight:800; font-size:27px; color:var(--ink); letter-spacing:-.3px; }
.logo .word b{ color:var(--roxo-600); }

/* =========================================================================
   Onboarding / Role select
   ========================================================================= */
.onb{ height:100%; display:flex; flex-direction:column; }
.onb .hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:30px; position:relative; overflow:hidden; }
.onb .blob{ position:absolute; border-radius:50%; filter:blur(8px); opacity:.5; }

.choice{
  width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:20px; padding:16px;
  display:flex; gap:14px; align-items:center; transition:.15s; box-shadow:0 4px 0 var(--line);
}
.choice:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
.choice.sel{ border-color:var(--roxo-500); background:var(--roxo-50); box-shadow:0 4px 0 var(--roxo-300); }
.choice .emoji{ width:50px; height:50px; border-radius:14px; background:var(--roxo-50); display:grid; place-items:center; font-size:26px; flex:none; }
.choice.sel .emoji{ background:#fff; }

.dots{ display:flex; gap:7px; justify-content:center; }
.dots i{ width:8px; height:8px; border-radius:50%; background:var(--line-strong); display:block; transition:.2s; }
.dots i.on{ width:24px; border-radius:5px; background:var(--roxo-500); }

/* =========================================================================
   Learning path (trilha)
   ========================================================================= */
.path{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0 30px; }
.node{ position:relative; display:flex; flex-direction:column; align-items:center; }
.node .bubble{
  width:74px; height:74px; border-radius:50%; display:grid; place-items:center; font-size:30px; color:#fff;
  box-shadow:0 7px 0 rgba(0,0,0,.16); transition:transform .1s; position:relative;
}
.node .bubble:active{ transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.16); }
.node.done .bubble{ background:var(--grad-verde); box-shadow:0 7px 0 var(--verde-600); }
.node.current .bubble{ background:var(--grad-roxo); box-shadow:0 7px 0 #5B21B6; animation:bob 1.8s ease-in-out infinite; }
.node.locked .bubble{ background:#D9D4E6; box-shadow:0 7px 0 #C3BCD6; color:#fff; }
.node .label{ font-weight:900; font-size:13px; margin-top:8px; color:var(--ink-soft); max-width:150px; text-align:center; }
.node .crown{ position:absolute; top:-14px; font-size:20px; }
.start-here{ position:absolute; top:-44px; background:#fff; border:2px solid var(--roxo-200,#DDD6FE); color:var(--roxo-700); font-weight:900; font-size:12px; padding:6px 12px; border-radius:12px; box-shadow:var(--sh-md); white-space:nowrap; }
.start-here::after{ content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%) rotate(45deg); width:12px; height:12px; background:#fff; border-right:2px solid #DDD6FE; border-bottom:2px solid #DDD6FE; }
@keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }

.unit-banner{ background:var(--grad-roxo); color:#fff; border-radius:20px; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--sh-md); }

/* =========================================================================
   Flashcard game
   ========================================================================= */
.game{ height:100%; display:flex; flex-direction:column; background:var(--surface-2); }
.game-top{ display:flex; align-items:center; gap:12px; padding:14px 16px; }
.game-top .bar{ flex:1; }
.combo{ position:absolute; right:16px; top:54px; font-family:'Baloo 2'; font-weight:800; color:var(--laranja-600); font-size:15px; opacity:0; transition:.2s; }
.combo.show{ opacity:1; animation:pop .4s; }
@keyframes pop{ from{ transform:scale(.6);} to{ transform:scale(1);} }

.card-area{ flex:1; display:flex; align-items:center; justify-content:center; padding:10px 20px; min-height:0; perspective:1600px; }
.flashcard{ width:100%; max-width:340px; aspect-ratio:3/4; position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.8,.2,1); cursor:pointer; }
.flashcard.flipped{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; border-radius:26px; backface-visibility:hidden;
  display:flex; flex-direction:column; padding:24px; box-shadow:var(--sh-lg); border:1px solid var(--line);
}
.face.front{ background:#fff; }
.face.back{ background:linear-gradient(160deg,#fff, var(--roxo-50)); transform:rotateY(180deg); }
.face .subject-tag{ align-self:flex-start; }
.face .q{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-family:'Baloo 2'; font-weight:600; font-size:22px; color:var(--ink); }
.face .a-label{ font-weight:900; text-transform:uppercase; letter-spacing:1px; font-size:12px; color:var(--roxo-600); }
.face .hint{ text-align:center; color:var(--ink-faint); font-weight:800; font-size:13px; }
.flip-hint{ position:absolute; bottom:14px; left:0; right:0; text-align:center; color:var(--ink-faint); font-weight:800; font-size:12px; }

.rate-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); }
.rate{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:11px 4px; border-radius:16px; font-weight:900; font-size:12px; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.16); transition:transform .08s; }
.rate:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.16); }
.rate .ic{ font-size:20px; }
.rate.err{ background:var(--vermelho-500); box-shadow:0 4px 0 #B91C1C; }
.rate.hard{ background:var(--laranja-500); box-shadow:0 4px 0 var(--laranja-600); }
.rate.good{ background:var(--verde-500); box-shadow:0 4px 0 var(--verde-600); }
.rate.easy{ background:var(--azul-500); box-shadow:0 4px 0 #2563EB; }
.rate .when{ font-size:10px; opacity:.85; font-weight:800; }

.reveal-hint{ padding:14px 16px calc(16px + env(safe-area-inset-bottom)); }

/* floating +XP */
.xp-float{ position:absolute; font-family:'Baloo 2'; font-weight:800; color:var(--amarelo-400); font-size:24px; text-shadow:0 2px 0 #B45309; pointer-events:none; animation:xpUp 1s ease-out forwards; z-index:50; }
@keyframes xpUp{ 0%{opacity:0; transform:translateY(10px) scale(.6);} 25%{opacity:1;} 100%{opacity:0; transform:translateY(-60px) scale(1.1);} }

/* Session complete */
.complete{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; padding:30px; position:relative; }
.trophy{ font-size:84px; animation:bob 2s ease-in-out infinite; filter:drop-shadow(0 12px 18px rgba(124,58,237,.35)); }
.stat-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; }
.stat-tile{ border-radius:18px; padding:14px; text-align:left; color:#fff; }
.stat-tile .v{ font-family:'Baloo 2'; font-weight:800; font-size:26px; }
.stat-tile .k{ font-weight:800; font-size:12px; opacity:.92; text-transform:uppercase; letter-spacing:.5px; }

/* =========================================================================
   Ranking / Ligas
   ========================================================================= */
.league-head{ background:var(--grad-roxo); color:#fff; padding:22px 18px; text-align:center; }
.seg{ display:flex; gap:6px; background:#F1EFF6; padding:5px; border-radius:14px; }
.seg button{ flex:1; padding:9px; border-radius:10px; font-weight:900; font-size:13px; color:var(--ink-soft); }
.seg button.on{ background:#fff; color:var(--roxo-700); box-shadow:var(--sh-sm); }

.rank-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:#fff; border:1px solid var(--line); }
.rank-row.me{ border-color:var(--roxo-400,#A78BFA); background:var(--roxo-50); box-shadow:0 4px 0 var(--roxo-300); }
.rank-pos{ width:30px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:18px; color:var(--ink-faint); }
.rank-row.top1 .rank-pos{ color:#EAB308; } .rank-row.top2 .rank-pos{ color:#94A3B8; } .rank-row.top3 .rank-pos{ color:#B45309; }
.promo-line{ display:flex; align-items:center; gap:10px; color:var(--verde-600); font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
.promo-line::before,.promo-line::after{ content:""; flex:1; height:2px; background:var(--verde-300); border-radius:2px; }

/* =========================================================================
   Profile / stats
   ========================================================================= */
.kpi{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px; }
.kpi .v{ font-family:'Baloo 2'; font-weight:800; font-size:26px; }
.kpi .k{ color:var(--ink-soft); font-weight:800; font-size:12px; }

.subj-row{ display:flex; align-items:center; gap:12px; }
.subj-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:20px; flex:none; }

.ach{ display:flex; gap:12px; align-items:center; padding:12px; border-radius:16px; border:1px solid var(--line); background:#fff; }
.ach .medal{ width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-size:24px; flex:none; }
.ach.locked{ opacity:.5; filter:grayscale(.6); }

.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal .d{ aspect-ratio:1; border-radius:8px; background:var(--line); display:grid; place-items:center; font-size:11px; font-weight:800; color:var(--ink-faint); }
.cal .d.l1{ background:var(--verde-100); color:var(--verde-600);} .cal .d.l2{ background:var(--verde-300); color:#14532d;} .cal .d.l3{ background:var(--verde-500); color:#fff;} .cal .d.l4{ background:var(--verde-600); color:#fff;}

/* Personalização */
.opt-chip{ padding:10px 14px; border-radius:14px; border:2px solid var(--line); background:#fff; font-weight:800; font-size:14px; color:var(--ink-soft); transition:.12s; }
.opt-chip.on{ border-color:var(--roxo-500); background:var(--roxo-50); color:var(--roxo-700); }
.uni-card{ display:flex; align-items:center; gap:14px; padding:14px; border-radius:18px; border:2px solid var(--line); background:#fff; }
.uni-card.on{ border-color:var(--roxo-500); background:var(--roxo-50); box-shadow:0 4px 0 var(--roxo-300); }
.uni-logo{ width:48px; height:48px; border-radius:12px; display:grid; place-items:center; font-family:'Baloo 2'; font-weight:800; color:#fff; font-size:16px; flex:none; }

.ai-card{ background:linear-gradient(135deg,#312E81,#6D28D9); color:#fff; border-radius:20px; padding:18px; position:relative; overflow:hidden; }
.ai-card .spark{ position:absolute; right:-10px; top:-10px; font-size:90px; opacity:.18; }

/* =========================================================================
   SCHOOL PORTAL (desktop / professional)
   ========================================================================= */
.portal{ display:flex; height:100%; width:100%; background:#F4F6FB; }
.side{
  width:248px; flex:none; background:#1A1130; color:#CFC8E6; display:flex; flex-direction:column; padding:18px 14px;
}
.side .logo .word{ color:#fff; } .side .logo .word b{ color:var(--roxo-300); }
.side .nav{ margin-top:18px; display:flex; flex-direction:column; gap:4px; }
.side .nav a{ display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:12px; font-weight:800; font-size:14px; color:#B8AFD6; cursor:pointer; transition:.12s; }
.side .nav a:hover{ background:rgba(255,255,255,.06); color:#fff; }
.side .nav a.on{ background:var(--roxo-600); color:#fff; box-shadow:0 6px 16px rgba(124,58,237,.4); }
.side .nav a .ic{ font-size:18px; width:22px; text-align:center; }
.side .school-chip{ margin-top:auto; background:rgba(255,255,255,.06); border-radius:14px; padding:12px; display:flex; gap:10px; align-items:center; }

.portal-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.portal-top{ height:64px; flex:none; background:#fff; border-bottom:1px solid #E7E9F2; display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
.portal-body{ flex:1; overflow-y:auto; padding:24px; }
.portal-body .maxw{ max-width:1180px; margin:0 auto; }

.grid-kpi{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.pcard{ background:#fff; border:1px solid #E7E9F2; border-radius:18px; padding:18px; }
.pcard .v{ font-family:'Baloo 2'; font-weight:800; font-size:30px; color:var(--ink); }
.pcard .k{ color:#6B7280; font-weight:800; font-size:13px; }
.pcard .delta{ font-weight:900; font-size:12px; padding:3px 8px; border-radius:8px; }
.delta.up{ background:var(--verde-100); color:var(--verde-600);} .delta.down{ background:var(--vermelho-100); color:var(--vermelho-500); }

.grid-2{ display:grid; grid-template-columns:1.6fr 1fr; gap:16px; }
.grid-2b{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

table.tbl{ width:100%; border-collapse:collapse; font-size:14px; }
table.tbl th{ text-align:left; font-weight:900; color:#6B7280; font-size:12px; text-transform:uppercase; letter-spacing:.4px; padding:10px 12px; border-bottom:2px solid #EEF0F6; }
table.tbl td{ padding:12px; border-bottom:1px solid #F1F3F9; }
table.tbl tr:hover td{ background:#FAFBFE; cursor:pointer; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.dot.g{ background:var(--verde-500);} .dot.y{ background:var(--amarelo-400);} .dot.r{ background:var(--vermelho-500);} .dot.o{background:var(--laranja-500);}

.heat{ display:inline-block; padding:5px 9px; border-radius:8px; font-weight:900; font-size:12px; }

/* SVG charts */
.chart{ width:100%; }
.legend{ display:flex; gap:16px; flex-wrap:wrap; }
.legend span{ display:flex; align-items:center; gap:6px; font-weight:800; font-size:12px; color:#6B7280; }
.legend i{ width:12px; height:12px; border-radius:4px; display:block; }

/* Insight / suggestion box */
.insight{ border-left:4px solid var(--roxo-500); background:var(--roxo-50); border-radius:0 14px 14px 0; padding:14px 16px; }

/* role-switch floating */
.role-switch{ position:fixed; right:14px; bottom:14px; z-index:8000; display:flex; gap:8px; background:#fff; padding:7px; border-radius:16px; box-shadow:var(--sh-lg); border:1px solid var(--line); }
.role-switch button{ padding:8px 12px; border-radius:11px; font-weight:900; font-size:12px; color:var(--ink-soft); }
.role-switch button.on{ background:var(--roxo-600); color:#fff; }
@media (max-width:520px){ .role-switch{ bottom:auto; top:8px; right:8px; transform:scale(.9); } }

/* school responsive: collapse sidebar */
@media (max-width:860px){
  .side{ width:64px; padding:14px 8px; }
  .side .logo .word, .side .nav a span.t, .side .school-chip .col{ display:none; }
  .side .nav a{ justify-content:center; }
  .grid-kpi{ grid-template-columns:1fr 1fr; }
  .grid-2,.grid-2b{ grid-template-columns:1fr; }
}

/* fade transitions between screens */
.fade-in{ animation:fadeIn .28s ease both; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} }
.slide-in{ animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes slideIn{ from{ opacity:0; transform:translateX(24px);} }

/* misc */
.divider{ height:1px; background:var(--line); }
.hr-pad{ padding:0 18px; }
.section{ padding:6px 18px 18px; }
.empty-space{ height:14px; }
a.link{ color:var(--roxo-600); font-weight:800; cursor:pointer; }
.center-abs{ position:absolute; inset:0; display:grid; place-items:center; }
.shimmer{ background:linear-gradient(90deg,#eee,#f7f7f7,#eee); background-size:200% 100%; animation:shim 1.2s infinite; }
@keyframes shim{ to{ background-position:-200% 0; } }

function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $(sel, ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }

// ---- navigation ----
function go(route, params){
  App.route = route;
  App.params = params || {};
  render();

function setRole(role){

  render();
}

// ---- master render ----
function render(){

    view = SchoolPortal();

      case 'splash':       view = Splash(); break;
      case 'onboarding':   view = Onboarding(); break;
      case 'home':         view = PhoneShell(Home(), 'home'); break;
      case 'game':         view = PhoneShell(Game(), null); break;
      case 'complete':     view = PhoneShell(Complete(), null); break;
      case 'ranking':      view = PhoneShell(Ranking(), 'ranking'); break;
      case 'personalize':  view = PhoneShell(Personalize(), 'personalize'); break;
      case 'profile':      view = PhoneShell(Profile(), 'profile'); break;
      default:             view = Splash();
    }
  }
  App.root.innerHTML = view;
  bindAfterRender();
  renderRoleSwitch();
}

function renderRoleSwitch(){
  let rs = document.getElementById('role-switch');
  if(!rs){
    rs = el(`<div class="role-switch" id="role-switch">
      <button data-role="aluno">👤 Aluno</button>
      <button data-role="escola">🏫 Escola</button>
    </div>`);
    document.body.appendChild(rs);
    rs.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) setRole(b.dataset.role); });
  }
  $('#role-switch button').forEach(b=> b.classList.toggle('on', b.dataset.role===App.role));
  // hide switch on the very first splash to keep it clean? keep visible for demo.
}

// Hook up generic [data-go] navigation + screen-specific binds
function bindAfterRender(){
  $('[data-go]').forEach(node=>{
    node.addEventListener('click', ()=> go(node.dataset.go, node.dataset.param ? JSON.parse(node.dataset.param) : {}));
  });
  if(typeof bindHome==='function' && App.route==='home') bindHome();
  if(typeof bindGame==='function' && App.route==='game') bindGame();
  if(typeof bindOnboarding==='function' && App.route==='onboarding') bindOnboarding();
  if(typeof bindRanking==='function' && App.route==='ranking') bindRanking();
  if(typeof bindPersonalize==='function' && App.route==='personalize') bindPersonalize();
  if(typeof bindComplete==='function' && App.route==='complete') bindComplete();
  if(App.role==='escola' && typeof bindSchool==='function') bindSchool();
}

    { id:'personalize', route:'personalize', ic:'🎯', label:'Personalizar' },

  ];
  const tabbar = activeTab ? `
    <div class="tabbar">
      ${tabs.map(t=>`
        <div class="tab ${t.id===activeTab?'active':''}" data-go="${t.route}">
          <div class="ic">${t.ic}</div><div>${t.label}</div>
        </div>`).join('')}
    </div>` : '';
  return `
  <div class="stage">
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="screen">
        <div class="screen-body scroll fade-in">${inner}</div>
        ${tabbar}
      </div>
    </div>
  </div>`;
}

function toast(msg, type, icon){
  const layer = document.getElementById('toast-layer');
  const t = el(`<div class="toast ${type||''}">${icon?`<span>${icon}</span>`:''}<span>${msg}</span></div>`);
  layer.appendChild(t);
  setTimeout(()=>{ t.style.transition='.3s'; t.style.opacity='0'; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),300); }, 1900);
}

// Confetti burst
function confetti(opts){
  const c = document.getElementById('fx-canvas');
  const ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#7C3AED','#22C55E','#FB923C','#FACC15','#EC4899','#3B82F6'];
  const N = (opts&&opts.count)||140;
  const parts = [];
  const cx = (opts&&opts.x) || innerWidth/2;
  const cy = (opts&&opts.y) || innerHeight/2;
  for(let i=0;i<N;i++){
    parts.push({
      x:cx, y:cy,
      vx:(Math.random()-.5)*14, vy:(Math.random()*-15)-4,
      g:0.4+Math.random()*0.3, r:5+Math.random()*7,
      rot:Math.random()*6, vr:(Math.random()-.5)*.4,
      c:colors[(Math.random()*colors.length)|0], life:0, max:80+Math.random()*40,
      shape: Math.random()>.5?'rect':'circ',
    });
  }
  let frame=0;
  function step(){
    ctx.clearRect(0,0,c.width,c.height);
    let alive=false;
    parts.forEach(p=>{
      if(p.life>p.max) return;
      alive=true; p.life++;
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1-(p.life/p.max));
      ctx.fillStyle=p.c;
      if(p.shape==='rect') ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4);
      else { ctx.beginPath(); ctx.arc(0,0,p.r/1.6,0,7); ctx.fill(); }
      ctx.restore();
    });
    frame++;
    if(alive && frame<160) requestAnimationFrame(step);
    else ctx.clearRect(0,0,c.width,c.height);
  }
  step();
}

// floating +XP near an element
function floatXp(amount, target){
  const r = target.getBoundingClientRect();
  const f = el(`<div class="xp-float">+${amount} XP</div>`);
  f.style.left = (r.left + r.width/2 - 20)+'px';
  f.style.top = (r.top + 20)+'px';
  f.style.position='fixed'; f.style.zIndex=9200;
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 1000);
}

// Animated bar chart (vertical)
function barChart(data, opts){
  opts = opts || {};
  const W = opts.w||520, H = opts.h||180, pad=24;
  const max = Math.max.apply(null, data.map(d=>d.v)) * 1.15 || 1;
  const bw = (W - pad*2) / data.length;
  const bars = data.map((d,i)=>{
    const h = (d.v/max)*(H-pad-24);
    const x = pad + i*bw + bw*0.18;
    const w = bw*0.64;
    const y = H-24-h;
    const color = d.color || '#7C3AED';
    return `
      <rect x="${x}" y="${H-24}" width="${w}" height="0" rx="6" fill="${color}">
        <animate attributeName="height" from="0" to="${h}" dur="0.7s" fill="freeze" begin="${i*0.05}s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
        <animate attributeName="y" from="${H-24}" to="${y}" dur="0.7s" fill="freeze" begin="${i*0.05}s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </rect>
      ${opts.values?`<text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="800" fill="#5B5470">${d.v}</text>`:''}
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="700" fill="#9690A8">${d.l}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

// Horizontal bars (for accuracy by subject)
function hBars(data, opts){
  opts = opts || {};
  const W = opts.w||520, rowH=34, pad=8;
  const H = data.length*rowH + pad*2;
  const labelW = opts.labelW||96;
  const max = 100;
  const rows = data.map((d,i)=>{
    const y = pad + i*rowH;
    const full = W - labelW - 50;
    const w = (d.v/max)*full;
    const color = d.color||'#7C3AED';
    return `
      <text x="0" y="${y+rowH/2+4}" font-size="12.5" font-weight="800" fill="#1F1235">${d.l}</text>
      <rect x="${labelW}" y="${y+8}" width="${full}" height="${rowH-16}" rx="9" fill="#EEEBF5"/>
      <rect x="${labelW}" y="${y+8}" width="0" height="${rowH-16}" rx="9" fill="${color}">
        <animate attributeName="width" from="0" to="${w}" dur="0.8s" fill="freeze" begin="${i*0.06}s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="${W-2}" y="${y+rowH/2+4}" text-anchor="end" font-size="12.5" font-weight="900" fill="${color}">${d.v}%</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${rows}</svg>`;
}

// Line/area chart
function lineChart(values, opts){
  opts = opts || {};
  const W = opts.w||520, H = opts.h||180, pad=18, padB=22;
  const max = Math.max.apply(null, values)*1.2 || 1;
  const stepX = (W-pad*2)/(values.length-1);
  const pts = values.map((v,i)=>[pad+i*stepX, H-padB-(v/max)*(H-pad-padB)]);
  const line = pts.map((p,i)=> (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length-1][0]} ${H-padB} L ${pts[0][0]} ${H-padB} Z`;
  const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#7C3AED" stroke="#fff" stroke-width="2"/>`).join('');
  const color = opts.color||'#7C3AED';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${opts.cssH||180}px">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity="0.28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="1400" stroke-dashoffset="1400"><animate attributeName="stroke-dashoffset" to="0" dur="1s" fill="freeze"/></path>
    ${dots}
  </svg>`;
}

// Donut / progress ring
function ring(pct, opts){
  opts = opts || {};
  const size = opts.size||120, sw=opts.stroke||14, r=(size-sw)/2, c=2*Math.PI*r;
  const color = opts.color||'#7C3AED';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EEEBF5" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 ${size/2} ${size/2})">
      <animate attributeName="stroke-dashoffset" from="${c}" to="${c*(1-pct/100)}" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </circle>
    <text x="50%" y="50%" text-anchor="middle" dy="0.1em" font-family="'Baloo 2'" font-weight="800" font-size="${size*0.26}" fill="${color}">${opts.label!==undefined?opts.label:pct+'%'}</text>
    ${opts.sub?`<text x="50%" y="50%" dy="${size*0.22}" text-anchor="middle" font-size="11" font-weight="800" fill="#9690A8">${opts.sub}</text>`:''}
  </svg>`;
}

// Count-up animation on a number element
function countUp(node, to, dur){
  dur = dur||900; const start=performance.now(); const from=0;
  function tick(now){
    const t = Math.min(1,(now-start)/dur);
    const e = 1-Math.pow(1-t,3);
    node.textContent = Math.round(from+(to-from)*e).toLocaleString('pt-BR');
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// GAME — sessão de flashcards

function startDeck(){
  // build deck from selected subjects, fallback to all
  let pool = CARDS.filter(c=> App.s.selectedSubjects.includes(c.s));
  if(pool.length < 6) pool = CARDS.slice();
  // shuffle
  pool = pool.slice().sort(()=>Math.random()-0.5).slice(0, 8);
  App.s.deck = pool.map(c=>({ ...c, flipped:false, rated:false }));
  App.s.deckIndex = 0;
  App.s.combo = 0;
  App.s.sessionCorrect = 0;
  App.s.sessionTotal = 0;
  App.s.sessionXp = 0;
}

function Game(){
  if(!App.s.deck.length || App.s.deckIndex===0 && App.params.fresh!==false){
    if(!App.s.deck.length) startDeck();
  }
  const idx = App.s.deckIndex;
  const card = App.s.deck[idx];
  const subj = SUBJECTS[card.s];
  const pct = Math.round(idx / App.s.deck.length * 100);
  return `
  <div class="game">
    <div class="game-top">
      <button class="icon-btn" id="game-quit" style="background:#F1EFF6;color:var(--ink-soft)">✕</button>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <span class="tag-stat tag-life" style="font-size:13px">❤️ ${App.s.lives}</span>
    </div>
    <div class="combo ${App.s.combo>=2?'show':''}" id="combo">🔥 Combo x${App.s.combo}</div>

    <div class="card-area">
      <div class="flashcard" id="flashcard">
        <div class="face front">
          <span class="subject-tag pill" style="background:${subj.color}1a;color:${subj.color}">${subj.emoji} ${subj.name} · ${card.sub}</span>
          <div class="q">${card.q}</div>
          <div class="flip-hint">👆 Toque para ver a resposta</div>
        </div>
        <div class="face back">
          <span class="a-label">Resposta</span>
          <div class="q" style="font-size:19px;font-weight:700">${card.a}</div>
          <div class="hint">Você acertou? Seja honesto — isso treina a IA 🧠</div>
        </div>
      </div>
    </div>

    <div id="game-actions">
      <div class="reveal-hint" id="reveal-hint">
        <button class="btn btn-roxo btn-block btn-lg" id="reveal-btn">Mostrar resposta</button>
      </div>
    </div>
  </div>`;
}

function rateButtons(){
  return `
  <div class="rate-grid slide-in">
    <button class="rate err" data-rate="0"><span class="ic">😵</span>Errei<span class="when">&lt; 10min</span></button>
    <button class="rate hard" data-rate="1"><span class="ic">😬</span>Difícil<span class="when">1 dia</span></button>
    <button class="rate good" data-rate="2"><span class="ic">🙂</span>Bom<span class="when">3 dias</span></button>
    <button class="rate easy" data-rate="3"><span class="ic">😎</span>Fácil<span class="when">7 dias</span></button>
  </div>`;
}

function bindGame(){
  const fc = $('#flashcard');
  const flip = ()=>{
    fc.classList.add('flipped');
    const actions = $('#game-actions');
    actions.innerHTML = rateButtons();
    bindRates();
  };
  $('#reveal-btn') && $('#reveal-btn').addEventListener('click', flip);
  fc.addEventListener('click', ()=>{ if(!fc.classList.contains('flipped')) flip(); });
  $('#game-quit').addEventListener('click', ()=>{
    if(confirm('Sair da sessão? Seu progresso desta sessão será perdido.')){ App.s.deck=[]; go('home'); }
  });

  function bindRates(){
    $('.rate[data-rate]').forEach(b=> b.addEventListener('click', ()=> answer(parseInt(b.dataset.rate), b)));
  }

  function answer(rating, btn){
    const correct = rating >= 2;       // Bom/Fácil = acerto
    App.s.sessionTotal++;
    if(correct){
      App.s.sessionCorrect++;
      App.s.combo++;
      const base = rating===3 ? 12 : 10;
      const bonus = Math.min(App.s.combo, 5) * 2;     // combo bonus
      const gain = base + bonus;
      App.s.sessionXp += gain;
      floatXp(gain, btn);
      if(App.s.combo>=3) toast(`Combo x${App.s.combo}! +${bonus} XP de bônus 🔥`,'warn','🔥');
    } else {
      App.s.combo = 0;
      App.s.lives = Math.max(0, App.s.lives-1);
      toast('Sem problema — vamos revisar em breve 💪','brand','📌');
    }
    // advance
    App.s.deckIndex++;
    if(App.s.deckIndex >= App.s.deck.length || App.s.lives<=0){
      finishSession();
    } else {
      render();
    }
  }

  function finishSession(){
    App.s.xp += App.s.sessionXp;
    App.s.xpToday += App.s.sessionXp;
    if(App.s.sessionCorrect>0 && App.s.combo>=0){ /* keep streak */ }
    go('complete');
  }
}

        const html = `<div class="rank-row ${u.me?'me':''} ${top}">
          <div class="rank-pos">${medal}</div>

          <div class="tag-stat tag-xp" style="font-size:14px">${u.xp.toLocaleString('pt-BR')}</div>

// ---- helpers ----
function kpiCard(label, val, delta, up, color){
  return `<div class="pcard">
    <div class="row between"><div class="k">${label}</div>${delta?`<span class="delta ${up?'up':'down'}">${up?'▲':'▼'} ${delta}</span>`:''}</div>
    <div class="v" style="${color?`color:${color}`:''}">${val}</div>
  </div>`;
}
function heatColor(acc){
  if(acc>=80) return '#22C55E'; if(acc>=70) return '#84CC16'; if(acc>=60) return '#FACC15'; if(acc>=50) return '#FB923C'; return '#EF4444';
}
function statusDot(s){ return `<span class="dot ${s}"></span>`; }

              <td class="muted b">${a.foco}</td>
              <td>${statusDot(a.status)} <span class="small b muted">${a.status==='g'?'Em dia':a.status==='y'?'Atenção':'Em risco'}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="tiny faint b mt12">🔒 A escola visualiza desempenho e constância. Não vê conteúdo privado nem interfere na experiência do aluno.</p>
  `;
}

function SchoolStudentDetail(){
  const a = SCHOOL.alunos.find(x=>x.name===App.s.detailStudent) || SCHOOL.alunos[0];
  const subj = STUDENT.bySubject.map(x=>({ l:SUBJECTS[x.s].name, v:x.acc, color:SUBJECTS[x.s].color }));
  const week = STUDENT.weeklyXp.map((v,i)=>({ l:['S','T','Q','Q','S','S','D'][i], v }));
  return `
    <button class="btn btn-outline btn-sm" data-back-alunos>← Voltar para alunos</button>
    <div class="pcard" style="margin-top:14px">
      <div class="row between">
        <div class="row gap12">
          <div class="avatar" style="width:54px;height:54px;font-size:22px;background:var(--roxo-600)">${a.name[0]}</div>
          <div><div class="h3">${a.name}</div><div class="muted b small">${a.turma} · ${SCHOOL.name}</div></div>
        </div>
        <div class="row gap10">
          <span class="tag-stat tag-streak">🔥 ${a.streak} dias</span>
          <span class="heat" style="background:${heatColor(a.acc)}1a;color:${heatColor(a.acc)};font-size:14px;padding:8px 12px">${a.acc}% acerto</span>
        </div>
      </div>
    </div>

    <div class="grid-kpi" style="margin-top:16px">
      ${kpiCard('Tempo na semana', Math.round(a.min/60*10)/10+'h', null, true, 'var(--roxo-700)')}
      ${kpiCard('Cards na semana', (a.min*3), null, true, 'var(--azul-500)')}
      ${kpiCard('Maior dificuldade', a.foco, null, true, 'var(--vermelho-500)')}
      ${kpiCard('Status', a.status==='g'?'Em dia':a.status==='y'?'Atenção':'Em risco', null, true, heatColor(a.acc))}
    </div>

    <div class="grid-2" style="margin-top:16px">
      <div class="pcard">
        <div class="b9">Atividade de XP (semana)</div>
        ${barChart(week,{h:200,values:true})}
      </div>
      <div class="pcard">
        <div class="b9">Acerto por matéria</div>
        <div class="mt8">${hBars(subj,{})}</div>
      </div>
    </div>

    <div class="pcard" style="margin-top:16px">
      <div class="insight"><span class="small b">💡 ${a.name} tem ótima constância, mas ${a.foco!=='—'?a.foco+' está abaixo da média da turma':'desempenho equilibrado'}. Sugestão: indicar um bloco de revisão focado.</span></div>
    </div>
  `;
}

// =========================================================================
// DIFICULDADES (agregado da escola)
// =========================================================================
function SchoolDificuldades(){
  return `
    <p class="muted b">Temas em que a escola mais erra — base para planejar aulas e atividades.</p>
    <div class="grid-2b" style="margin-top:14px">
      ${SCHOOL.dificuldades.map(d=>`
        <div class="pcard">
          <div class="row between">
            <div><span class="pill gray small">${d.mat}</span><div class="h3 mt8">${d.tema}</div></div>
            <div class="tcenter">${ring(d.acc,{size:96,stroke:11,color:heatColor(d.acc),label:d.acc+'%'})}</div>
          </div>
          <div class="row between mt12">
            <span class="small muted b">${d.alunos} alunos com dificuldade</span>
            <button class="btn btn-ghost btn-sm" data-page="atividades">Criar atividade</button>
          </div>
        </div>`).join('')}
    </div>

    <div class="pcard" style="margin-top:16px">
      <div class="insight"><span class="small b">💡 A IA da Flipei cruza o desempenho da turma com a incidência desses temas nas provas. <b>Funções exponenciais</b> caem muito no ENEM e tem só 48% de acerto — prioridade máxima.</span></div>
    </div>
  `;
}

          <div class="row gap10">
            <div class="grow"><div class="tiny faint b">Turma</div><input value="3º Ano A, B e C" style="border:1px solid #E7E9F2;border-radius:12px;padding:10px 14px;font-family:inherit;font-weight:700;width:100%;margin-top:4px"/></div>
            <div class="grow"><div class="tiny faint b">Prazo</div><input value="20 jun" style="border:1px solid #E7E9F2;border-radius:12px;padding:10px 14px;font-family:inherit;font-weight:700;width:100%;margin-top:4px"/></div>
          </div>
          <div><div class="tiny faint b">Meta</div>
            <div class="row gap8 mt4"><span class="pill">30 flashcards</span><span class="pill outline">15 min</span><span class="pill outline">+ personalizar</span></div>
          </div>
          <button class="btn btn-roxo btn-block" id="create-act">📌 Publicar atividade para os alunos</button>
          <p class="tiny faint b">Os alunos recebem como um desafio gamificado no app — sem perder a experiência divertida.</p>
        </div>
      </div>

      <div class="pcard">
        <div class="b9">Atividades em andamento</div>
        <div class="col gap10 mt12">
          ${[
            { t:'Revisão: Estequiometria', turma:'3º Ano B', ad:78, prazo:'em 2 dias' },
            { t:'Maratona de Biologia', turma:'2º Ano A', ad:92, prazo:'hoje' },
            { t:'Simulado ENEM — Humanas', turma:'Todas', ad:54, prazo:'em 5 dias' },
          ].map(x=>`
