<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7C3AED" />
  <title>Flipei — Estudar virou jogo</title>
  <meta name="description" content="Flipei: flashcards + gamificação + IA para ENEM e vestibulares. Protótipo de experiência." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* =========================================================================
   FLIPEI — Design System
   Paleta: Roxo (principal) + Verde-limão (acerto) + Laranja (streak) + Amarelo (XP)
   Fonte de tipografia: Baloo 2 (display/divertida) + Nunito (texto)
   ========================================================================= */

:root {
  /* Brand */
  --roxo-900: #4C1D95;
  --roxo-700: #6D28D9;
  --roxo-600: #7C3AED;   /* principal */
  --roxo-500: #8B5CF6;
  --roxo-300: #C4B5FD;
  --roxo-100: #EDE9FE;
  --roxo-50:  #F5F3FF;

  --verde-600: #16A34A;
  --verde-500: #22C55E;  /* acerto / sucesso */
  --verde-300: #86EFAC;
  --verde-100: #DCFCE7;

  --laranja-500: #FB923C; /* streak */
  --laranja-600: #F97316;
  --laranja-100: #FFEDD5;

  --amarelo-400: #FACC15; /* XP / gems */
  --amarelo-300: #FDE047;
  --amarelo-100: #FEF9C3;

  --vermelho-500: #EF4444; /* erro / vidas */
  --vermelho-100: #FEE2E2;

  --azul-500: #3B82F6;
  --rosa-500: #EC4899;

  /* Neutros */
  --ink: #1F1235;        /* texto principal (roxo-quase-preto) */
  --ink-soft: #5B5470;
  --ink-faint: #9690A8;
  --line: #ECE9F2;
  --line-strong: #DCD7E8;
  --bg: #F7F5FB;
  --surface: #FFFFFF;
  --surface-2: #FBFAFE;

  /* Sombras */
  --sh-sm: 0 1px 2px rgba(31,18,53,.06), 0 1px 3px rgba(31,18,53,.05);
  --sh-md: 0 6px 18px rgba(31,18,53,.08);
  --sh-lg: 0 16px 40px rgba(31,18,53,.14);
  --sh-pop: 0 10px 0 rgba(0,0,0,.10); /* botões 3D */

  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-xl: 34px;

  --grad-brand: linear-gradient(120deg, #7C3AED 0%, #A21CAF 50%, #DB2777 100%);
  --grad-roxo: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
  --grad-verde: linear-gradient(135deg, #4ADE80 0%, #16A34A 100%);
  --grad-streak: linear-gradient(135deg, #FDBA74 0%, #F97316 100%);
  --grad-xp: linear-gradient(135deg, #FDE047 0%, #F59E0B 100%);
  --grad-festa: linear-gradient(120deg,#8B5CF6,#EC4899,#FB923C,#FACC15);
}

/* ---------- Reset ---------- */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height:100%; }
body {
  font-family:'Nunito', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size:16px;
  line-height:1.45;
  overflow:hidden;
  position:fixed;
  inset:0;
}
h1,h2,h3,h4,.display { font-family:'Baloo 2', 'Nunito', sans-serif; line-height:1.15; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
img { max-width:100%; display:block; }
::selection { background: var(--roxo-300); }

/* Scroll helpers */
.scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color: var(--roxo-300) transparent; }
.scroll::-webkit-scrollbar{ width:8px; }
.scroll::-webkit-scrollbar-thumb{ background:var(--roxo-300); border-radius:8px; }

/* =========================================================================
   FX canvas + Toasts
   ========================================================================= */
#fx-canvas{ position:fixed; inset:0; pointer-events:none; z-index:9000; }
#toast-layer{ position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:9500; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(440px,92vw); }
.toast{
  background:var(--ink); color:#fff; padding:11px 16px; border-radius:14px;
  font-weight:800; font-size:14px; box-shadow:var(--sh-lg);
  display:flex; gap:9px; align-items:center; animation:toastIn .35s cubic-bezier(.2,1.4,.4,1) both;
}
.toast.success{ background:var(--verde-600); }
.toast.warn{ background:var(--laranja-600); }
.toast.brand{ background:var(--roxo-700); }
@keyframes toastIn{ from{opacity:0; transform:translateY(-16px) scale(.9);} }

/* =========================================================================
   App shell — frame
   ========================================================================= */
#app{ width:100%; height:100%; }

/* Stage centers the phone on desktop; full bleed on mobile */
.stage{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(139,92,246,.18), transparent 60%),
    radial-gradient(700px 500px at 105% 110%, rgba(251,146,60,.16), transparent 55%),
    var(--bg);
}

/* Phone (student app) */
.phone{
  position:relative;
  width:420px; max-width:100%;
  height:min(900px, 100%);
  background:var(--surface);
  border-radius:42px;
  box-shadow: var(--sh-lg);
  overflow:hidden;
  display:flex; flex-direction:column;
  border:1px solid var(--line);
}
.phone-notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:140px; height:26px; background:var(--ink); border-radius:0 0 16px 16px; z-index:60;
}
.screen{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
.screen-body{ flex:1; min-height:0; position:relative; }

@media (max-width:520px){
  .stage{ background:var(--surface); }
  .phone{ width:100%; height:100%; border-radius:0; border:none; box-shadow:none; }
  .phone-notch{ display:none; }
}

/* =========================================================================
   Buttons
   ========================================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  font-weight:900; font-size:16px; letter-spacing:.2px;
  padding:15px 22px; border-radius:18px; user-select:none;
  transition:transform .08s ease, filter .15s ease, box-shadow .15s ease;
  position:relative; text-transform:uppercase;
}
.btn:active{ transform:translateY(3px); }
.btn-3d{ box-shadow:0 5px 0 rgba(0,0,0,.18); }
.btn-3d:active{ box-shadow:0 1px 0 rgba(0,0,0,.18); }
.btn-roxo{ background:var(--roxo-600); color:#fff; box-shadow:0 5px 0 #5B21B6; }
.btn-roxo:active{ box-shadow:0 1px 0 #5B21B6; }
.btn-verde{ background:var(--verde-500); color:#fff; box-shadow:0 5px 0 var(--verde-600); }
.btn-verde:active{ box-shadow:0 1px 0 var(--verde-600); }
.btn-amarelo{ background:var(--amarelo-400); color:#7A4F01; box-shadow:0 5px 0 #D69E00; }
.btn-ghost{ background:var(--roxo-50); color:var(--roxo-700); }
.btn-outline{ background:#fff; color:var(--roxo-700); border:2px solid var(--line-strong); box-shadow:0 4px 0 var(--line-strong); }
.btn-outline:active{ box-shadow:0 1px 0 var(--line-strong); }
.btn-block{ width:100%; }
.btn-lg{ font-size:18px; padding:17px 24px; }
.btn-sm{ font-size:13px; padding:9px 14px; border-radius:13px; }
.btn[disabled]{ opacity:.45; pointer-events:none; }

.icon-btn{ width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:20px; background:var(--roxo-50); color:var(--roxo-700); }

/* =========================================================================
   Generic UI
   ========================================================================= */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-sm); }
.pad{ padding:18px; }
.row{ display:flex; align-items:center; gap:12px; }
.col{ display:flex; flex-direction:column; }
.between{ justify-content:space-between; }
.center{ align-items:center; justify-content:center; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1; }
.gap6{ gap:6px;} .gap8{gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;} .gap16{gap:16px;} .gap20{gap:20px;}
.mt4{margin-top:4px;} .mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;} .mt24{margin-top:24px;}
.muted{ color:var(--ink-soft); } .faint{ color:var(--ink-faint); }
.tcenter{ text-align:center; }
.h1{ font-size:30px; font-weight:800; }
.h2{ font-size:23px; font-weight:800; }
.h3{ font-size:19px; font-weight:800; }
.eyebrow{ font-weight:900; text-transform:uppercase; letter-spacing:1.4px; font-size:12px; color:var(--roxo-600); }
.small{ font-size:13px; } .tiny{ font-size:11px; }
.b{ font-weight:800; } .b9{ font-weight:900; }

.pill{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-weight:800; font-size:13px; background:var(--roxo-50); color:var(--roxo-700); }
.pill.gray{ background:#F1EFF6; color:var(--ink-soft); }
.pill.green{ background:var(--verde-100); color:var(--verde-600); }
.pill.orange{ background:var(--laranja-100); color:var(--laranja-600); }
.pill.outline{ background:#fff; border:1.5px solid var(--line-strong); color:var(--ink-soft); }

.tag-stat{ display:inline-flex; align-items:center; gap:6px; font-weight:900; font-size:15px; padding:7px 12px; border-radius:14px; }
.tag-streak{ background:var(--laranja-100); color:var(--laranja-600); }
.tag-xp{ background:var(--amarelo-100); color:#B45309; }
.tag-gem{ background:#E0F2FE; color:#0369A1; }
.tag-life{ background:var(--vermelho-100); color:var(--vermelho-500); }

/* Progress */
.bar{ height:14px; background:var(--line); border-radius:999px; overflow:hidden; }
.bar > span{ display:block; height:100%; border-radius:999px; background:var(--grad-verde); transition:width .5s cubic-bezier(.2,1,.3,1); }
.bar.xp > span{ background:var(--grad-xp); }
.bar.roxo > span{ background:var(--grad-roxo); }
.bar.thin{ height:9px; }

/* Avatar */
.avatar{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-weight:900; color:#fff; font-size:18px; flex:none; }

/* Topbar (student) */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; gap:10px; }
.topbar .brand-mini{ display:flex; align-items:center; gap:9px; font-family:'Baloo 2'; font-weight:800; font-size:20px; color:var(--roxo-700); }

/* Bottom nav */
.tabbar{
  display:flex; align-items:stretch; justify-content:space-around;
  background:#fff; border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 4px; border-radius:14px; color:var(--ink-faint); font-weight:800; font-size:11px; transition:.15s; }
.tab .ic{ font-size:23px; line-height:1; transition:transform .15s; }
.tab.active{ color:var(--roxo-700); background:var(--roxo-50); }
.tab.active .ic{ transform:translateY(-1px) scale(1.12); }

/* =========================================================================
   Logo — wordmark "flipei" minúsculo com gradiente roxo→magenta
   ========================================================================= */
.logo-word{
  font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; letter-spacing:-1px; line-height:1;
  background:var(--grad-brand); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent; display:inline-block;
}
.logo-word.light{ background:linear-gradient(120deg,#C4B5FD,#F0ABFC,#F9A8D4); -webkit-background-clip:text; background-clip:text; }
.logo-hero{ display:flex; align-items:center; justify-content:center; }
.logo-hero .logo-word{ filter:drop-shadow(0 8px 16px rgba(168,28,175,.25)); }

/* splash flip illustration (CSS puro) */
.flip-illo{ position:relative; width:120px; height:130px; margin-bottom:4px; }
.flip-illo .fi-card{ position:absolute; width:92px; height:120px; border-radius:18px; box-shadow:var(--sh-lg); }
.flip-illo .fi-back{ left:8px; top:6px; background:linear-gradient(160deg,#EDE9FE,#FBCFE8); transform:rotate(-12deg); }
.flip-illo .fi-front{ right:0; top:0; background:var(--grad-brand); transform:rotate(8deg); display:grid; place-items:center; animation:bob 2.4s ease-in-out infinite; }
.flip-illo .fi-front span{ font-family:'Baloo 2'; font-weight:800; font-size:46px; color:#fff; }
.splash-hero{ gap:14px; }

/* =========================================================================
   Onboarding / Role select
   ========================================================================= */
.onb{ height:100%; display:flex; flex-direction:column; }
.onb .hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:30px; position:relative; overflow:hidden; }
.onb .blob{ position:absolute; border-radius:50%; filter:blur(8px); opacity:.5; }

.choice{
  width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:20px; padding:16px;
  display:flex; gap:14px; align-items:center; transition:.15s; box-shadow:0 4px 0 var(--line);
}
.choice:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
.choice.sel{ border-color:var(--roxo-500); background:var(--roxo-50); box-shadow:0 4px 0 var(--roxo-300); }
.choice .emoji{ width:50px; height:50px; border-radius:14px; background:var(--roxo-50); display:grid; place-items:center; font-size:26px; flex:none; }
.choice.sel .emoji{ background:#fff; }

.dots{ display:flex; gap:7px; justify-content:center; }
.dots i{ width:8px; height:8px; border-radius:50%; background:var(--line-strong); display:block; transition:.2s; }
.dots i.on{ width:24px; border-radius:5px; background:var(--roxo-500); }

/* =========================================================================
   Learning path (trilha)
   ========================================================================= */
.path{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0 30px; }
.node{ position:relative; display:flex; flex-direction:column; align-items:center; }
.node .bubble{
  width:74px; height:74px; border-radius:50%; display:grid; place-items:center; font-size:30px; color:#fff;
  box-shadow:0 7px 0 rgba(0,0,0,.16); transition:transform .1s; position:relative;
}
.node .bubble:active{ transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.16); }
.node.done .bubble{ background:var(--grad-verde); box-shadow:0 7px 0 var(--verde-600); }
.node.current .bubble{ background:var(--grad-roxo); box-shadow:0 7px 0 #5B21B6; animation:bob 1.8s ease-in-out infinite; }
.node.locked .bubble{ background:#D9D4E6; box-shadow:0 7px 0 #C3BCD6; color:#fff; }
.node .label{ font-weight:900; font-size:13px; margin-top:8px; color:var(--ink-soft); max-width:150px; text-align:center; }
.node .crown{ position:absolute; top:-14px; font-size:20px; }
.start-here{ position:absolute; top:-44px; background:#fff; border:2px solid var(--roxo-200,#DDD6FE); color:var(--roxo-700); font-weight:900; font-size:12px; padding:6px 12px; border-radius:12px; box-shadow:var(--sh-md); white-space:nowrap; }
.start-here::after{ content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%) rotate(45deg); width:12px; height:12px; background:#fff; border-right:2px solid #DDD6FE; border-bottom:2px solid #DDD6FE; }
@keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }

.unit-banner{ background:var(--grad-roxo); color:#fff; border-radius:20px; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--sh-md); }

/* =========================================================================
   Flashcard game
   ========================================================================= */
.game{ height:100%; display:flex; flex-direction:column; background:var(--surface-2); }
.game-top{ display:flex; align-items:center; gap:12px; padding:14px 16px; }
.game-top .bar{ flex:1; }
.combo{ position:absolute; right:16px; top:54px; font-family:'Baloo 2'; font-weight:800; color:var(--laranja-600); font-size:15px; opacity:0; transition:.2s; }
.combo.show{ opacity:1; animation:pop .4s; }
@keyframes pop{ from{ transform:scale(.6);} to{ transform:scale(1);} }

.card-area{ flex:1; display:flex; align-items:center; justify-content:center; padding:10px 20px; min-height:0; perspective:1600px; }
.flashcard{ width:100%; max-width:340px; aspect-ratio:3/4; position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.8,.2,1); cursor:pointer; }
.flashcard.flipped{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; border-radius:26px; backface-visibility:hidden;
  display:flex; flex-direction:column; padding:24px; box-shadow:var(--sh-lg); border:1px solid var(--line);
}
.face.front{ background:#fff; }
.face.back{ background:linear-gradient(160deg,#fff, var(--roxo-50)); transform:rotateY(180deg); }
.face .subject-tag{ align-self:flex-start; }
.face .q{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-family:'Baloo 2'; font-weight:600; font-size:22px; color:var(--ink); }
.face .a-label{ font-weight:900; text-transform:uppercase; letter-spacing:1px; font-size:12px; color:var(--roxo-600); }
.face .hint{ text-align:center; color:var(--ink-faint); font-weight:800; font-size:13px; }
.flip-hint{ position:absolute; bottom:14px; left:0; right:0; text-align:center; color:var(--ink-faint); font-weight:800; font-size:12px; }

.rate-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); }
.rate{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:11px 4px; border-radius:16px; font-weight:900; font-size:12px; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.16); transition:transform .08s; }
.rate:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.16); }
.rate .ic{ font-size:20px; }
.rate.err{ background:var(--vermelho-500); box-shadow:0 4px 0 #B91C1C; }
.rate.hard{ background:var(--laranja-500); box-shadow:0 4px 0 var(--laranja-600); }
.rate.good{ background:var(--verde-500); box-shadow:0 4px 0 var(--verde-600); }
.rate.easy{ background:var(--azul-500); box-shadow:0 4px 0 #2563EB; }
.rate .when{ font-size:10px; opacity:.85; font-weight:800; }

.reveal-hint{ padding:14px 16px calc(16px + env(safe-area-inset-bottom)); }

/* floating +XP */
.xp-float{ position:absolute; font-family:'Baloo 2'; font-weight:800; color:var(--amarelo-400); font-size:24px; text-shadow:0 2px 0 #B45309; pointer-events:none; animation:xpUp 1s ease-out forwards; z-index:50; }
@keyframes xpUp{ 0%{opacity:0; transform:translateY(10px) scale(.6);} 25%{opacity:1;} 100%{opacity:0; transform:translateY(-60px) scale(1.1);} }

/* Session complete */
.complete{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; padding:30px; position:relative; }
.trophy{ font-size:84px; animation:bob 2s ease-in-out infinite; filter:drop-shadow(0 12px 18px rgba(124,58,237,.35)); }
.stat-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; }
.stat-tile{ border-radius:18px; padding:14px; text-align:left; color:#fff; }
.stat-tile .v{ font-family:'Baloo 2'; font-weight:800; font-size:26px; }
.stat-tile .k{ font-weight:800; font-size:12px; opacity:.92; text-transform:uppercase; letter-spacing:.5px; }

/* =========================================================================
   Ranking / Ligas
   ========================================================================= */
.league-head{ background:var(--grad-roxo); color:#fff; padding:22px 18px; text-align:center; }
.seg{ display:flex; gap:6px; background:#F1EFF6; padding:5px; border-radius:14px; }
.seg button{ flex:1; padding:9px; border-radius:10px; font-weight:900; font-size:13px; color:var(--ink-soft); }
.seg button.on{ background:#fff; color:var(--roxo-700); box-shadow:var(--sh-sm); }

.rank-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:#fff; border:1px solid var(--line); }
.rank-row.me{ border-color:var(--roxo-400,#A78BFA); background:var(--roxo-50); box-shadow:0 4px 0 var(--roxo-300); }
.rank-pos{ width:30px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:18px; color:var(--ink-faint); }
.rank-row.top1 .rank-pos{ color:#EAB308; } .rank-row.top2 .rank-pos{ color:#94A3B8; } .rank-row.top3 .rank-pos{ color:#B45309; }
.promo-line{ display:flex; align-items:center; gap:10px; color:var(--verde-600); font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
.promo-line::before,.promo-line::after{ content:""; flex:1; height:2px; background:var(--verde-300); border-radius:2px; }

/* =========================================================================
   Profile / stats
   ========================================================================= */
.kpi{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px; }
.kpi .v{ font-family:'Baloo 2'; font-weight:800; font-size:26px; }
.kpi .k{ color:var(--ink-soft); font-weight:800; font-size:12px; }

.subj-row{ display:flex; align-items:center; gap:12px; }
.subj-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:20px; flex:none; }

.ach{ display:flex; gap:12px; align-items:center; padding:12px; border-radius:16px; border:1px solid var(--line); background:#fff; }
.ach .medal{ width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-size:24px; flex:none; }
.ach.locked{ opacity:.5; filter:grayscale(.6); }

// ---- tiny DOM helpers ----
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $(sel, ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- navigation ----
function go(route, params){ App.route = route; App.params = params || {}; render(); }
function setRole(role){
  App.role = role;
  if(role === 'escola'){ App.s.schoolPage = 'dashboard'; App.s.detailStudent = null; }
  else if(App.route && App.route.indexOf('school')===0){ App.route = 'home'; }
  render();
}
function setDevice(d){ App.device = d; render(); }

// ---- master render ----
function render(){
  App.root = App.root || document.getElementById('app');
  let view = '';
  if(App.role === 'escola'){
    view = SchoolPortal();
  } else if(App.route === 'splash'){
    view = DeviceWrap(Splash(), { bare:true });
  } else if(App.route === 'onboarding'){
    view = DeviceWrap(Onboarding(), { bare:true });
  } else {
    const tab = ['home','decks','jornada','ranking','premios','profile'].includes(App.route) ? App.route : null;
    const inner = ScreenFor(App.route);
    view = DeviceWrap(inner, { tab });
  }
  App.root.innerHTML = view;
  applyTheme();
  renderControls();
  wireOnce();
  runPostRender();
}

function ScreenFor(route){
  switch(route){
    case 'home':         return Home();
    case 'decks':        return Decks();
    case 'jornada':      return Jornada();
    case 'game':         return Game();
    case 'complete':     return Complete();
    case 'ranking':      return Ranking();
    case 'premios':      return Premios();
    case 'profile':      return Profile();
    case 'linkSchool':   return LinkSchool();
    default:             return Home();
  }
}

// post-render side effects (charts already animate via SVG; confetti etc.)
function runPostRender(){
  if(App.role==='aluno' && App.route==='complete'){
    confetti({count:160, y: innerHeight*0.30});
    const xpNode = $('#c-xp'); if(xpNode) countUp(xpNode, App.s.sessionXp, 1000);
    App.s.deck = [];
  }
}

// =========================================================================
// EVENT DELEGATION — uma única escuta global (robusto, sem rebind)
// =========================================================================
function wireOnce(){
  if(App._wired) return;
  App._wired = true;

  document.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-act]');
    if(!t) return;
    handleAct(t.dataset.act, t, e);
  });
  // live model binding p/ inputs de texto (sem re-render, preserva foco)
  document.addEventListener('input', (e)=>{
    const t = e.target.closest('[data-model]');
    if(t){ App.s[t.dataset.model] = t.value; refreshOnbButton(); }
  });
  window.addEventListener('resize', ()=>{ const c=document.getElementById('fx-canvas'); if(c){c.width=innerWidth;c.height=innerHeight;} });
}

function refreshOnbButton(){
  if(App.route!=='onboarding') return;
  const btn = $('#onb-next'); if(!btn) return;
  btn.disabled = !onbCanContinue();
}

function handleAct(act, t, e){
  const d = t.dataset;
  switch(act){
    // global
    case 'go':        go(d.route); break;
    case 'role':      setRole(d.r); break;
    case 'device':    setDevice(d.d); break;

    // onboarding
    case 'onb-pick':  App.s.onb_goalKind = d.val; render(); break;
    case 'onb-suggest': App.s.onb_goalText = d.val; render(); break;
    case 'onb-level': App.s.onb_level = d.val; render(); break;
    case 'onb-time':  App.s.onb_time = d.val; render(); break;
    case 'onb-back':  if(App.s.onboardStep===0){ go('splash'); } else { App.s.onboardStep--; render(); } break;
    case 'onb-next':  onbNext(); break;

    // game
    case 'reveal':    App.s.revealed = true; render(); break;
    case 'rate':      gameAnswer(parseInt(d.rate,10), t); break;
    case 'quit':      if(confirm('Sair da sessão? O progresso desta sessão será perdido.')){ App.s.deck=[]; App.s.revealed=false; go('home'); } break;

    // ranking
    case 'rank-tab':  App.s.rankTab = d.tab; render(); break;

    // decks / personalização
    case 'unlock-deck': unlockDeck(d.deck); break;
    case 'study-deck':  startStudy('deck', d.deck); break;
    case 'start-daily': startStudy('daily'); break;
    case 'set-goal':    App.s.dailyGoalCards = parseInt(d.goal,10); toast('Meta diária: '+d.goal+' cards','success','🎯'); render(); break;

    // revisão por prova (Perfil)
    case 'exam-pick':   App.s.examReviewSel = d.exam; render(); break;
    case 'start-exam':  startStudy('exam', App.s.examReviewSel); break;

    // prêmios / recompensas
    case 'shop-tab':    App.s.shopTab = d.tab; render(); break;
    case 'buy-item':    buyItem(d.type, d.id); break;
    case 'equip-item':  equipItem(d.type, d.id); break;

    // vincular escola
    case 'link-open':  go('linkSchool'); break;
    case 'link-submit': submitLink(); break;
    case 'link-cancel': go('profile'); break;
    case 'unlink':     if(confirm('Desvincular da escola? Ela deixará de ver seu progresso.')){ App.s.linkedSchool=null; toast('Escola desvinculada','brand','🔌'); go('profile'); } break;

    // school portal
    case 'school-page': App.s.schoolPage=d.page; App.s.detailStudent=null; render(); break;
    case 'school-period': App.s.schoolPeriod=d.period; render(); break;
    case 'open-student': App.s.detailStudent=d.student; App.s.schoolPage='alunos'; render(); break;
    case 'back-students': App.s.detailStudent=null; render(); break;
    case 'deck-add-card': schoolAddCard(); break;
    case 'deck-publish': schoolPublishDeck(); break;
  }
}

// =========================================================================
// Toasts + FX
// =========================================================================
function toast(msg, type, icon){
  const layer = document.getElementById('toast-layer');
  const t = el(`<div class="toast ${type||''}">${icon?`<span>${icon}</span>`:''}<span>${msg}</span></div>`);
  layer.appendChild(t);
  setTimeout(()=>{ t.style.transition='.3s'; t.style.opacity='0'; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),300); }, 1900);
}

function confetti(opts){
  const c = document.getElementById('fx-canvas'); if(!c) return;
  const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const colors = ['#7C3AED','#DB2777','#22C55E','#FB923C','#FACC15','#3B82F6'];
  const N = (opts&&opts.count)||140, parts=[];
  const cx=(opts&&opts.x)||innerWidth/2, cy=(opts&&opts.y)||innerHeight/2;
  for(let i=0;i<N;i++) parts.push({ x:cx,y:cy, vx:(Math.random()-.5)*14, vy:(Math.random()*-15)-4, g:.4+Math.random()*.3, r:5+Math.random()*7, rot:Math.random()*6, vr:(Math.random()-.5)*.4, c:colors[(Math.random()*colors.length)|0], life:0, max:80+Math.random()*40, shape:Math.random()>.5?'rect':'circ' });
  let frame=0;
  (function step(){
    ctx.clearRect(0,0,c.width,c.height); let alive=false;
    parts.forEach(p=>{ if(p.life>p.max) return; alive=true; p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.fillStyle=p.c;
      if(p.shape==='rect') ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4); else { ctx.beginPath(); ctx.arc(0,0,p.r/1.6,0,7); ctx.fill(); }
      ctx.restore(); });
    frame++; if(alive&&frame<160) requestAnimationFrame(step); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

function floatXp(amount, target){
  if(!target||!target.getBoundingClientRect) return;
  const r = target.getBoundingClientRect();
  const f = el(`<div class="xp-float">+${amount} XP</div>`);
  f.style.cssText = `left:${r.left+r.width/2-20}px;top:${r.top+10}px;position:fixed;z-index:9200;`;
  document.body.appendChild(f); setTimeout(()=>f.remove(),1000);
}

// =========================================================================
// SVG charts
// =========================================================================
function barChart(data, opts){
  opts=opts||{}; const W=opts.w||520,H=opts.h||180,pad=24;
  const max=Math.max.apply(null,data.map(d=>d.v))*1.15||1, bw=(W-pad*2)/data.length;
  const bars=data.map((d,i)=>{ const h=(d.v/max)*(H-pad-24), x=pad+i*bw+bw*0.18, w=bw*0.64, y=H-24-h, color=d.color||'#7C3AED';
    return `<rect x="${x}" y="${H-24}" width="${w}" height="0" rx="6" fill="${color}">
      <animate attributeName="height" from="0" to="${h}" dur="0.7s" fill="freeze" begin="${i*0.05}s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      <animate attributeName="y" from="${H-24}" to="${y}" dur="0.7s" fill="freeze" begin="${i*0.05}s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
      ${opts.values?`<text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="800" fill="#5B5470">${d.v}</text>`:''}
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="700" fill="#9690A8">${d.l}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}
function hBars(data, opts){
  opts=opts||{}; const W=opts.w||520,rowH=34,pad=8,H=data.length*rowH+pad*2,labelW=opts.labelW||96,max=100;
  const rows=data.map((d,i)=>{ const y=pad+i*rowH,full=W-labelW-50,w=(d.v/max)*full,color=d.color||'#7C3AED';
    return `<text x="0" y="${y+rowH/2+4}" font-size="12.5" font-weight="800" fill="#1F1235">${d.l}</text>
      <rect x="${labelW}" y="${y+8}" width="${full}" height="${rowH-16}" rx="9" fill="#EEEBF5"/>
      <rect x="${labelW}" y="${y+8}" width="0" height="${rowH-16}" rx="9" fill="${color}">
        <animate attributeName="width" from="0" to="${w}" dur="0.8s" fill="freeze" begin="${i*0.06}s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
      <text x="${W-2}" y="${y+rowH/2+4}" text-anchor="end" font-size="12.5" font-weight="900" fill="${color}">${d.v}%</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${rows}</svg>`;
}
function lineChart(values, opts){
  opts=opts||{}; const W=opts.w||520,H=opts.h||180,pad=18,padB=22;
  const max=Math.max.apply(null,values)*1.2||1, stepX=(W-pad*2)/(values.length-1);
  const pts=values.map((v,i)=>[pad+i*stepX, H-padB-(v/max)*(H-pad-padB)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${pts[pts.length-1][0]} ${H-padB} L ${pts[0][0]} ${H-padB} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#7C3AED" stroke="#fff" stroke-width="2"/>`).join('');
  const color=opts.color||'#7C3AED';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${opts.cssH||180}px">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400"><animate attributeName="stroke-dashoffset" to="0" dur="1s" fill="freeze"/></path>
    ${dots}</svg>`;
}
function ring(pct, opts){
  opts=opts||{}; const size=opts.size||120,sw=opts.stroke||14,r=(size-sw)/2,c=2*Math.PI*r,color=opts.color||'#7C3AED';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EEEBF5" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 ${size/2} ${size/2})">
      <animate attributeName="stroke-dashoffset" from="${c}" to="${c*(1-pct/100)}" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <text x="50%" y="50%" text-anchor="middle" dy="0.1em" font-family="'Baloo 2'" font-weight="800" font-size="${size*0.26}" fill="${color}">${opts.label!==undefined?opts.label:pct+'%'}</text>
    ${opts.sub?`<text x="50%" y="50%" dy="${size*0.22}" text-anchor="middle" font-size="11" font-weight="800" fill="#9690A8">${opts.sub}</text>`:''}</svg>`;
}
function countUp(node, to, dur){
  dur=dur||900; const start=performance.now();
  (function tick(now){ const t=Math.min(1,(now-start)/dur), e=1-Math.pow(1-t,3); node.textContent=Math.round(to*e).toLocaleString('pt-BR'); if(t<1) requestAnimationFrame(tick); })(performance.now());
}

// sparkline minimalista (para KPIs do portal)
function sparkline(values, color){
  const W=130,H=36,max=Math.max.apply(null,values),min=Math.min.apply(null,values),rng=(max-min)||1,sx=W/(values.length-1);
  const pts=values.map((v,i)=>[i*sx, H-4-((v-min)/rng)*(H-9)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${W} ${H} L 0 ${H} Z`;
  color=color||'#7C3AED';
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="sp${Math.random().toString(36).slice(2,7)}" x1="0" y1="0" x2="0" y2="1"></linearGradient></defs>
    <path d="${area}" fill="${color}" opacity="0.08"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// aplica o tema cosmético equipado (muda o acento da interface)
function applyTheme(){
  if(!document.body) return;
  const t = (App.role==='aluno' && App.s.equipped) ? App.s.equipped.theme : 'default';
  document.body.setAttribute('data-theme', t || 'default');
}

function LogoBig(size){ return `<div class="logo-hero"><span class="logo-word" style="font-size:${size||64}px">flipei</span></div>`; }

// ---------- helpers de decks ----------
function unlockedDecks(){ return DECKS.filter(d=>d.unlocked); }
function dueToday(){ return unlockedDecks().reduce((a,d)=>a+d.due,0); }
function deckById(id){ return DECKS.find(d=>d.id===id); }

function unlockDeck(id){
  const d = deckById(id); if(!d) return;
  d.unlocked = true; d.due = Math.max(d.due, Math.round(d.total*0.5));
  toast(`Deck liberado: ${d.name} 🎉`,'success','🔓');
  confetti({ count:90, y: innerHeight*0.4 });
  render();
}

function startStudy(mode, payload){
  if(mode==='daily'){ App.s.studySource = { mode, label:'Revisão do dia' }; }
  else if(mode==='deck'){ const d=deckById(payload); App.s.studySource = { mode, label:d?d.name:'Deck', deckId:payload, s:d?d.s:null }; }
  else if(mode==='exam'){ const ex=EXAMS.find(e=>e.id===payload); App.s.studySource = { mode, label:'Simulado '+(ex?ex.name:''), exam:payload }; }
  App.s.deck = [];
  go('game');
}

// ---------- recompensas: helpers ----------
function listFor(type){ return type==='avatar'?AVATARS : type==='frame'?FRAMES : type==='color'?COLORS : type==='theme'?THEMES : type==='title'?TITLES : UTILITIES; }
function itemFor(type,id){ return listFor(type).find(x=>x.id===id); }
function isOwned(type,id){ return (App.s.owned[type]||[]).includes(id); }

// avatar do usuário (personagem + cor + moldura equipados)
function avatarHTML(size){
  const e = App.s.equipped;
  const av = AVATARS.find(a=>a.id===e.avatar) || AVATARS[0];
  const fr = FRAMES.find(f=>f.id===e.frame) || FRAMES[0];
  const ring = fr.color ? `box-shadow:0 0 0 3px #fff, 0 0 0 6px ${fr.color}${fr.glow?`, 0 0 14px ${fr.color}`:''};` : '';
  return `<span class="av" style="width:${size}px;height:${size}px;background:${e.color};font-size:${Math.round(size*0.55)}px;${ring}">${av.emoji}</span>`;
}
function equippedTitle(){ const t=TITLES.find(x=>x.id===App.s.equipped.title); return t&&t.id!=='none'?t.name:''; }

function buyItem(type,id){
  const it = itemFor(type,id); if(!it) return;
  if(it.cost===null||it.cost===undefined){ toast('Esse item é só por conquista 🏆','brand','🔒'); return; }
  if(type!=='util' && isOwned(type,id)){ equipItem(type,id); return; }
  if(App.s.gems < it.cost){ toast('Gems insuficientes — estude pra ganhar mais 💎','warn','💎'); return; }
  App.s.gems -= it.cost;
  if(type==='util'){ App.s.inventory[id] = (App.s.inventory[id]||0)+ (id==='dica'?5:1); toast('Comprado: '+it.name,'success','✅'); }
  else {
    (App.s.owned[type]=App.s.owned[type]||[]).push(id);
    App.s.equipped[type] = id;            // equipa automaticamente
    if(type==='theme') applyTheme();
    const rare = it.rarity==='epico'||it.rarity==='lendario';
    toast('Desbloqueado: '+(it.name||id)+(rare?' 🎉':''),'success','🎁');
    if(rare) confetti({count:120,y:innerHeight*0.4});
  }
  render();
}
function equipItem(type,id){
  if(!isOwned(type,id)){ toast('Você ainda não tem esse item','warn','🔒'); return; }
  App.s.equipped[type] = id;
  if(type==='theme') applyTheme();
  toast('Equipado!','success','✨');
  render();
}

const CURSO_SUGGEST = ['Medicina','Direito','Engenharia','Psicologia','Administração','Enfermagem','Outro'];

function onbCanContinue(){
  const s = App.s;
  if(s.onboardStep===0){
    if(!s.onb_goalKind) return false;
    if((s.onb_goalKind==='uni'||s.onb_goalKind==='curso') && !String(s.onb_goalText||'').trim()) return false;
    return true;
  }
  if(s.onboardStep===1) return !!s.onb_level;
  if(s.onboardStep===2) return !!s.onb_time;
  return false;
}
function onbGoalLabel(){
  const s=App.s, k=s.onb_goalKind, txt=String(s.onb_goalText||'').trim();
  if(k==='enem') return 'ENEM 2026';
  if(k==='uni') return txt || 'Universidade';
  if(k==='curso') return txt ? (txt+' 🎯') : 'Curso';
  return 'Explorando';
}
function onbNext(){
  if(!onbCanContinue()){ toast('Escolha uma opção pra continuar 🙂','warn','👆'); return; }
  if(App.s.onboardStep < 2){ App.s.onboardStep++; render(); return; }
  App.s.goal = onbGoalLabel();
  if(App.s.onb_time) App.s.dailyGoalCards = parseInt(App.s.onb_time,10);
  if(App.s.onb_goalKind==='uni'){ const m=EXAMS.find(e=>String(App.s.onb_goalText).toLowerCase().includes(e.id)||String(App.s.onb_goalText).toUpperCase().includes(e.sigla)); if(m){ App.s.exam=m.id; App.s.examReviewSel=m.id; } }
  App.s.onboardStep = 0;
  toast('Perfil criado! Bem-vindo à Flipei 🎉','success','✨');
  confetti({count:130, y:innerHeight*0.4});
  go('home');
}

function Onboarding(){
  const s = App.s, step = s.onboardStep;
  let title, sub, body;
  if(step===0){
    title='O que você quer conquistar?'; sub='Sem pressuposições — você escolhe (e pode digitar).';
    const k = s.onb_goalKind; let extra='';
    if(k==='uni' || k==='curso'){
      const list = k==='uni'?UNI_SUGGEST:CURSO_SUGGEST;
      const ph = k==='uni'?'Digite a universidade (ex.: UFSC)':'Digite o curso (ex.: Veterinária)';
      extra = `<div class="onb-input-wrap slide-in">
          <div class="tiny faint b">${k==='uni'?'Qual universidade?':'Qual curso?'}</div>
          <input class="onb-input" data-model="onb_goalText" value="${esc(s.onb_goalText)}" placeholder="${ph}" />
          <div class="row wrap gap8 mt8">${list.map(x=>`<button class="opt-chip ${s.onb_goalText===x?'on':''}" data-act="onb-suggest" data-val="${esc(x)}">${x}</button>`).join('')}</div>
        </div>`;
    }
    body = `<div class="col gap10">${GOAL_KINDS.map(o=>`
        <button class="choice ${k===o.id?'sel':''}" data-act="onb-pick" data-val="${o.id}">
          <div class="emoji">${o.emoji}</div><div class="col"><div class="b9" style="font-size:16px">${o.t}</div><div class="small muted">${o.d}</div></div>
          <div class="grow"></div><div style="font-size:20px;color:var(--roxo-500)">${k===o.id?'✓':''}</div></button>`).join('')}</div>${extra}`;
  } else if(step===1){
    title='Como está sua rotina hoje?'; sub='Sem julgamentos — só pra começar do jeito certo.';
    body = `<div class="col gap10">${LEVELS.map(o=>`
      <button class="choice ${s.onb_level===o.id?'sel':''}" data-act="onb-level" data-val="${o.id}">
        <div class="emoji">${o.emoji}</div><div class="col"><div class="b9" style="font-size:16px">${o.t}</div><div class="small muted">${o.d}</div></div>
        <div class="grow"></div><div style="font-size:20px;color:var(--roxo-500)">${s.onb_level===o.id?'✓':''}</div></button>`).join('')}</div>`;
  } else {
    title='Sua meta diária'; sub='Estudar pouco e todo dia vale mais que maratonar.';
    body = `<div class="col gap10">${TIMES.map(o=>`
      <button class="choice ${s.onb_time===o.id?'sel':''}" data-act="onb-time" data-val="${o.id}">
        <div class="emoji">${o.emoji}</div><div class="col"><div class="b9" style="font-size:16px">${o.t}</div><div class="small muted">${o.d}</div></div>
        <div class="grow"></div><div style="font-size:20px;color:var(--roxo-500)">${s.onb_time===o.id?'✓':''}</div></button>`).join('')}</div>`;
  }
  return `
  <div class="onb">
    <div class="topbar">
      <button class="icon-btn" data-act="onb-back">←</button>
      <div class="bar roxo thin grow" style="max-width:200px"><span style="width:${(step+1)/3*100}%"></span></div>
      <div style="width:42px"></div>
    </div>
    <div style="padding:8px 22px 0;"><div class="eyebrow">Passo ${step+1} de 3</div><div class="h2 mt4">${title}</div><p class="muted b mt4">${sub}</p></div>
    <div class="scroll" style="flex:1;padding:18px 22px;">${body}</div>
    <div class="section"><button class="btn btn-roxo btn-block btn-lg" id="onb-next" data-act="onb-next" ${onbCanContinue()?'':'disabled'}>${step<2?'Continuar':'Criar meu perfil'}</button></div>
  </div>`;
}

  const nodeIcon = (n)=> n.type==='chest'?'🎁': n.type==='badge'?'🏅': n.type==='tier'?'👑': n.lvl;
  return `
  <div>

function prizeVisual(type,it){
  if(type==='avatar') return `<span class="av" style="width:46px;height:46px;background:#F1EFF6;font-size:26px">${it.emoji}</span>`;
  if(type==='util')   return `<span class="av" style="width:46px;height:46px;background:#F1EFF6;font-size:24px">${it.emoji}</span>`;
  if(type==='title')  return `<span class="av" style="width:46px;height:46px;background:#F1EFF6;font-size:22px">🏷️</span>`;
  if(type==='frame')  return `<span class="prize-ring" style="${it.color?`box-shadow:0 0 0 3px #fff,0 0 0 6px ${it.color}${it.glow?`,0 0 12px ${it.color}`:''}`:'border:2px dashed #CBD5E1'}"></span>`;
  if(type==='color')  return `<span class="prize-dot" style="background:${it.id}"></span>`;
  if(type==='theme'){ const g={default:'linear-gradient(135deg,#7C3AED,#DB2777)',ocean:'linear-gradient(135deg,#0EA5E9,#14B8A6)',sunset:'linear-gradient(135deg,#FB923C,#EC4899)',neon:'linear-gradient(135deg,#22D3EE,#A855F7)'}[it.id]||'#7C3AED'; return `<span class="prize-theme" style="background:${g}"></span>`; }
  return '';
}
function prizeCard(type,it){
  const owned = type!=='util' && isOwned(type,it.id);
  const eq = type!=='util' && App.s.equipped[type]===it.id;
  const rar = RARITY[it.rarity]||RARITY.comum;
  let btn;
  if(type==='util') btn=`<button class="btn btn-amarelo btn-sm" data-act="buy-item" data-type="util" data-id="${it.id}">${it.cost} 💎</button>`;
  else if(eq) btn=`<span class="pill green small">Equipado ✓</span>`;
  else if(owned) btn=`<button class="btn btn-outline btn-sm" data-act="equip-item" data-type="${type}" data-id="${it.id}">Equipar</button>`;
  else if(it.cost===null) btn=`<span class="pill outline small">🔒</span>`;
  else btn=`<button class="btn btn-amarelo btn-sm" data-act="buy-item" data-type="${type}" data-id="${it.id}">${it.cost} 💎</button>`;
  const sub = type==='util' ? it.desc : (rar.name + (!owned&&it.cost===null&&it.unlock ? ' · '+it.unlock : ''));
  return `<div class="prize">
    <div class="prize-vis">${prizeVisual(type,it)}</div>
    <div class="grow"><div class="b small">${it.name}</div><div class="tiny b" style="color:${type==='util'?'var(--ink-faint)':rar.color}">${sub}</div></div>
    ${btn}</div>`;
}

function startDeck(){
  const src = App.s.studySource || { mode:'daily' };
  let pool;
  if(src.mode==='deck' && src.s){ pool = CARDS.filter(c=>c.s===src.s); }
  else if(src.mode==='daily'){ const subs=[...new Set(unlockedDecks().map(d=>d.s))]; pool = CARDS.filter(c=>subs.includes(c.s)); }
  else { pool = CARDS.slice(); } // exam: banco inteiro (ponderado, conceitual)
  if(pool.length < 5) pool = CARDS.slice();
  pool = pool.slice().sort(()=>Math.random()-0.5).slice(0,8);
  App.s.deck = pool.map(c=>({ ...c }));
  App.s.deckIndex=0; App.s.revealed=false; App.s.combo=0;
  App.s.sessionCorrect=0; App.s.sessionTotal=0; App.s.sessionXp=0;
}

function Game(){
  if(!App.s.deck.length) startDeck();
  const idx = App.s.deckIndex, card = App.s.deck[idx], subj = SUBJECTS[card.s];
  const pct = Math.round(idx / App.s.deck.length * 100);
  const flipped = App.s.revealed;
  const srcLabel = (App.s.studySource && App.s.studySource.label) || 'Estudando';
  return `
  <div class="game">
    <div class="game-top">
      <button class="icon-btn" data-act="quit" style="background:#F1EFF6;color:var(--ink-soft)">✕</button>
      <div class="grow"><div class="tiny faint b" style="text-align:center;margin-bottom:3px">${srcLabel}</div><div class="bar"><span style="width:${pct}%"></span></div></div>
      <span class="pill small">${idx+1}/${App.s.deck.length}</span>
    </div>
    ${App.s.combo>=2?`<div class="combo show">🔥 Combo x${App.s.combo}</div>`:''}
    <div class="card-area">
      <div class="flashcard ${flipped?'flipped':''}" ${flipped?'':'data-act="reveal"'}>
        <div class="face front">
          <span class="subject-tag pill" style="background:${subj.color}1a;color:${subj.color}">${subj.emoji} ${subj.name} · ${card.sub}</span>
          <div class="q">${card.q}</div><div class="flip-hint">👆 Toque para ver a resposta</div>
        </div>
        <div class="face back">
          <span class="a-label">Resposta</span><div class="q" style="font-size:19px;font-weight:700">${card.a}</div>
          <div class="hint">Você acertou? Seja honesto — isso treina a IA 🧠</div>
        </div>
      </div>
    </div>
    ${flipped ? `
      <div class="rate-grid slide-in">
        <button class="rate err"  data-act="rate" data-rate="0"><span class="ic">😵</span>Errei<span class="when">rever já</span></button>
        <button class="rate hard" data-act="rate" data-rate="1"><span class="ic">😬</span>Difícil<span class="when">1 dia</span></button>
        <button class="rate good" data-act="rate" data-rate="2"><span class="ic">🙂</span>Bom<span class="when">3 dias</span></button>
        <button class="rate easy" data-act="rate" data-rate="3"><span class="ic">😎</span>Fácil<span class="when">7 dias</span></button>
      </div>` : `
      <div class="reveal-hint"><button class="btn btn-roxo btn-block btn-lg" data-act="reveal">Mostrar resposta</button></div>`}
  </div>`;
}

function gameAnswer(rating, btn){
  const correct = rating >= 2;
  App.s.sessionTotal++; App.s.cardsToday++;
  if(correct){
    App.s.sessionCorrect++; App.s.combo++;
    const base = rating===3?12:10, bonus=Math.min(App.s.combo,5)*2, gain=base+bonus;
    App.s.sessionXp += gain; floatXp(gain, btn);
    if(App.s.combo>=3) toast(`Combo x${App.s.combo}! +${bonus} XP de bônus 🔥`,'warn','🔥');
  } else { App.s.combo=0; toast('Tranquilo — esse volta logo pra você revisar 💪','brand','📌'); }
  App.s.deckIndex++; App.s.revealed=false;
  if(App.s.deckIndex >= App.s.deck.length){ App.s.xp += App.s.sessionXp; go('complete'); }
  else render();
}

function submitLink(){
  const code = (App.s.schoolCode || ($('#school-code') && $('#school-code').value) || '').trim();
  if(!code){ toast('Digite o código da escola','warn','⚠️'); return; }
  App.s.linkedSchool = /horizonte/i.test(code) ? 'Colégio Horizonte' : ('Escola '+code.split(/[-\s]/)[0][0].toUpperCase()+code.split(/[-\s]/)[0].slice(1).toLowerCase());
  toast('Conectado a '+App.s.linkedSchool+'! 🎉','success','🏫');
  confetti({count:110, y:innerHeight*0.4});
  go('profile');
}

// ---- helpers ----
function heatColor(acc){ if(acc>=80) return '#16A34A'; if(acc>=70) return '#65A30D'; if(acc>=60) return '#CA8A04'; if(acc>=50) return '#EA580C'; return '#DC2626'; }
function statusDot(s){ return `<span class="dot ${s}"></span>`; }
function kpiPro(label,val,delta,up,spark,color,sub){
  return `<div class="pcard kpi-pro">
    <div class="kpi-label">${label}</div>
    <div class="row between" style="align-items:flex-end;margin-top:2px">
      <div class="kpi-val" style="${color?`color:${color}`:''}">${val}</div>
      ${delta?`<span class="delta ${up?'up':'down'}">${up?'▲':'▼'} ${delta}</span>`:''}
    </div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
    ${spark?`<div class="kpi-spark">${spark}</div>`:''}
  </div>`;
}
function sectionTitle(t,sub){ return `<div class="psec"><div class="psec-t">${t}</div>${sub?`<div class="psec-s">${sub}</div>`:''}</div>`; }

          <div class="col gap10">

            <div class="row gap10">
              <div class="grow"><div class="tiny faint b">Matéria</div><select class="pro-input" data-model="deckSubj" style="width:100%">${Object.values(SUBJECTS).map(s=>`<option value="${s.id}" ${d.subj===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
              <div class="grow"><div class="tiny faint b">Turmas</div><input class="pro-input" value="3º Ano A, B" style="width:100%"/></div>
            </div>
            <div class="divider mt4"></div>
            <div class="b9 small">Adicionar card</div>
            <div><div class="tiny faint b">Frente</div><input class="pro-input" id="card-front" placeholder="Pergunta" style="width:100%"/></div>
            <div><div class="tiny faint b">Verso</div><input class="pro-input" id="card-back" placeholder="Resposta" style="width:100%"/></div>
            <button class="btn-pro" data-act="deck-add-card">＋ Adicionar card</button>
            <button class="btn btn-roxo btn-block" data-act="deck-publish">Publicar deck para os alunos</button>
          </div>
        </div>
        <div>
          <div class="row between"><span class="b9 small">Cards no deck (${d.cards.length})</span></div>
          <div class="col gap8 mt8">
            ${d.cards.length?d.cards.map(c=>`<div style="border:1px solid #E7E9F2;border-radius:10px;padding:10px"><div class="tiny faint b">Frente</div><div class="b small">${esc(c.q)}</div><div class="tiny faint b mt4">Verso</div><div class="small muted">${esc(c.a)}</div></div>`).join('')
              :`<div class="tcenter muted b small" style="padding:24px">Nenhum card ainda — adicione ao lado.</div>`}
          </div>
        </div>
      </div>
    </div>`;
}

// =========================================================================
// INSIGHTS
// =========================================================================
function insightCard(ins){
  const map={ positive:{ic:'▲',cls:'positive'}, warning:{ic:'!',cls:'warning'}, critical:{ic:'✕',cls:'critical'} };
  const m=map[ins.type]||map.warning;
  return `<div class="insight ${m.cls}">
    <div class="row gap10" style="align-items:flex-start">
      <span class="ins-ic ${m.cls}">${m.ic}</span>
      <div class="grow"><div class="b small">${ins.t}</div><div class="small muted b" style="margin-top:2px">${ins.d}</div>
        ${ins.acao?`<div class="ins-acao">↳ ${ins.acao}</div>`:''}</div>
    </div></div>`;
}
function SchoolInsights(){
  return `
    ${sectionTitle('Insights da plataforma','Leituras automáticas dos dados, com ações sugeridas — atualizadas diariamente')}
    <div class="col gap10">
      ${SCHOOL_INSIGHTS.map(ins=>`<div class="pcard" style="padding:0;overflow:hidden">${insightCard(ins)}<div class="ins-foot"><button class="btn-pro" data-act="school-page" data-page="atividades">Criar atividade</button><button class="btn-pro ghost">Marcar como visto</button></div></div>`).join('')}
    </div>`;
}

// funil
function funnelHTML(data){
  const max=data[0].v;
  return `<div class="funnel mt8">${data.map((f,i)=>{ const p=Math.round(f.v/max*100); const colors=['#6D28D9','#7C3AED','#8B5CF6','#A78BFA'];
    return `<div class="funnel-row"><div class="funnel-lbl"><span class="b small">${f.l}</span></div>
      <div class="funnel-track"><div class="funnel-bar" style="width:${p}%;background:${colors[i]||'#A78BFA'}">${f.v}</div></div>
      <div class="funnel-pct tiny b">${p}%</div></div>`; }).join('')}</div>`;
}

// handlers de deck (conteúdo)
function schoolAddCard(){
  const f=$('#card-front'), b=$('#card-back'); const q=f&&f.value.trim(), a=b&&b.value.trim();
  if(!q||!a){ toast('Preencha frente e verso do card','warn','⚠️'); return; }
  App.s.deckDraft.cards.push({q,a}); toast('Card adicionado ao deck','success','＋'); render();
}
function schoolPublishDeck(){
  const d=App.s.deckDraft; d.title=App.s.deckTitle||d.title; d.subj=App.s.deckSubj||d.subj;
  if(!d.cards.length){ toast('Adicione ao menos 1 card antes de publicar','warn','⚠️'); return; }
  toast(`Deck "${d.title||'Sem título'}" publicado para os alunos!`,'success','📇');
  confetti({count:90,y:innerHeight*0.3});
  App.s.deckDraft={title:'',subj:'bio',cards:[]}; App.s.deckTitle=''; App.s.deckSubj='bio'; render();
}
